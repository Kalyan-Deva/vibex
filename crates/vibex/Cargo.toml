[package]
name = "vibex"
description = "Vibex Terminal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vibex"
path = "src/main.rs"

[dependencies]
vibex-vt.workspace = true
vibex-term.workspace = true
vibex-pty.workspace = true
vibex-render.workspace = true
winit = "0.30"
softbuffer = "0.4"
arboard = { version = "3", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
accesskit = "0.25"
vibex-update = { path = "../vibex-update" }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
sha2 = "0.10"
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
